<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">How lanes works (illustration)</title>
  <desc id="d">A lead session hands work to three lane sessions. Each lane's context fills. When lane-api reaches the 70% line, it writes a RESUME note, is cleared, and resumes from the note while the other lanes keep building.</desc>
  <style>
    text { font-family: "Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; fill: #e8eaee; }
    .muted { fill: #8a93a3; font-size: 15px; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 13px; fill: #8a93a3; }
    .bar { transform-box: fill-box; transform-origin: left center; }
    .a { animation: a 14s linear infinite; }
    .b { animation: b 14s linear infinite; }
    .c { animation: c 14s linear infinite; }
    @keyframes a {
      0% { transform: scaleX(.08); fill: #8fb3ff; }
      34% { transform: scaleX(.70); fill: #8fb3ff; }
      35% { fill: #d9a441; }
      50% { transform: scaleX(.70); fill: #d9a441; }
      54% { transform: scaleX(.05); fill: #8fb3ff; }
      100% { transform: scaleX(.38); fill: #8fb3ff; }
    }
    @keyframes b { 0% { transform: scaleX(.22); } 100% { transform: scaleX(.58); } }
    @keyframes c { 0% { transform: scaleX(.12); } 100% { transform: scaleX(.44); } }
    .note { opacity: 0; animation: note 14s linear infinite; }
    @keyframes note { 0%,36% { opacity: 0; } 38%,52% { opacity: 1; } 56%,100% { opacity: 0; } }
    .clear { opacity: 0; animation: clear 14s linear infinite; }
    @keyframes clear { 0%,49% { opacity: 0; } 50%,56% { opacity: 1; } 58%,100% { opacity: 0; } }
    .resume { opacity: 0; animation: resume 14s linear infinite; }
    @keyframes resume { 0%,56% { opacity: 0; } 58%,90% { opacity: 1; } 94%,100% { opacity: 0; } }
    .ask { opacity: 0; animation: ask 14s linear infinite; }
    @keyframes ask { 0%,33% { opacity: 0; } 35%,48% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a,.b,.c,.note,.clear,.resume,.ask { animation: none; } .note { opacity: 1; } }
  </style>

  <rect width="960" height="380" rx="18" fill="#0f1115"/>

  <!-- lead -->
  <circle cx="92" cy="190" r="34" fill="#d9a441"/>
  <text x="92" y="196" text-anchor="middle" class="label" style="fill:#0f1115">lead</text>
  <text x="92" y="250" text-anchor="middle" class="small">plans, watches</text>
  <g fill="none" stroke="#3a4150" stroke-width="4" stroke-linecap="round">
    <path d="M126 190 C170 190 170 95 214 95"/>
    <path d="M126 190 L214 190"/>
    <path d="M126 190 C170 190 170 285 214 285"/>
  </g>

  <!-- lanes -->
  <g>
    <text x="230" y="80" class="label">lane-api</text>
    <rect x="230" y="92" width="520" height="16" rx="8" fill="#232833"/>
    <rect class="bar a" x="230" y="92" width="520" height="16" rx="8" fill="#8fb3ff"/>

    <text x="230" y="175" class="label">lane-ui</text>
    <rect x="230" y="187" width="520" height="16" rx="8" fill="#232833"/>
    <rect class="bar b" x="230" y="187" width="520" height="16" rx="8" fill="#8fb3ff"/>

    <text x="230" y="270" class="label">lane-docs</text>
    <rect x="230" y="282" width="520" height="16" rx="8" fill="#232833"/>
    <rect class="bar c" x="230" y="282" width="520" height="16" rx="8" fill="#8fb3ff"/>
  </g>

  <!-- 70% threshold -->
  <line x1="594" y1="60" x2="594" y2="312" stroke="#d9a441" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="594" y="332" text-anchor="middle" class="small" style="fill:#d9a441">70% context</text>

  <!-- events on lane-api -->
  <text class="ask" x="230" y="135" style="font-size:14px;fill:#d9a441">lead: write your RESUME note</text>
  <g class="note">
    <rect x="770" y="76" width="34" height="42" rx="5" fill="#e8eaee"/>
    <path d="M778 88 h18 M778 97 h18 M778 106 h11" stroke="#0f1115" stroke-width="3" stroke-linecap="round"/>
    <text x="814" y="104" class="muted">RESUME note</text>
  </g>
  <text class="clear" x="770" y="140" style="font-size:15px;font-weight:600;fill:#d9a441">/clear</text>
  <text class="resume" x="230" y="135" style="font-size:14px;fill:#8fb3ff">resumed from its note, keeps building</text>

  <text x="930" y="362" text-anchor="end" class="small">illustration, not a recording</text>
</svg>
