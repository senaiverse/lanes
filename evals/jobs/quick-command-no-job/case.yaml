schema_version: "1.1"
name: jobs-quick-command-no-job
description: A single quick command runs in the foreground, not as a job.
tags: [jobs, negative]
plugins: ["../../../plugins/lanes-jobs"]
runs: 1
execution:
  max_turns: 5
  allowed_tools: [Skill, Read]
  prompt: |
    Run `git --version` and tell me the output.
graders:
  - name: no-lanes-job
    type: tool_used
    tool: Bash
    input_match: 'lanes-job'
    min: 0
    max: 0
    arm: both
  - name: ran-the-command
    type: tool_used
    tool: Bash
    input_match: 'git --version'
    arm: both
