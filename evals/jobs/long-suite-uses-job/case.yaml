schema_version: "1.1"
name: jobs-long-suite-uses-job
description: A long suite on a shared machine goes through lanes-job run.
tags: [jobs, trigger]
plugins: ["../../../plugins/lanes-jobs"]
runs: 1
execution:
  max_turns: 8
  allowed_tools: [Skill, Read]
  prompt: |
    Run our full test suite with `npm test`. It takes about 15 minutes, and three other lane sessions on this machine are running their own suites at the same time.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jobs"'
  - name: used-lanes-job
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"]*?(?:&&|;)\s*)?(?:\S*/)?lanes-job\s+run\s[^"]*--\s+(?:env\s+\S+\s+)*npm\s+test'
